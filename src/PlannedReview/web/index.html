<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlannedReview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172b3a;
      background: #f3f6f8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 20px;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 30px;
      background: #fff;
      border: 1px solid #dce4e9;
      border-radius: 12px;
      box-shadow: 0 8px 28px #17324712;
    }

    h1 { margin: 0; font-size: 1.65rem; }
    .intro { margin: 8px 0 22px; color: #526574; }

    .drop-area {
      display: grid;
      min-height: 140px;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #f8fafb;
      border: 2px dashed #9aaeba;
      border-radius: 9px;
      transition: background .15s, border-color .15s;
    }

    .drop-area.dragging {
      background: #eaf5f2;
      border-color: #16836f;
    }

    .drop-area p { margin: 0 0 12px; color: #526574; }

    button, .download {
      display: inline-block;
      padding: 10px 16px;
      color: white;
      background: #176f65;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: wait; }
    .selected-file { min-height: 1.5em; margin: 10px 0; overflow-wrap: anywhere; }
    .actions { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .status { color: #526574; }

    .output-heading { margin: 22px 0 8px; font-size: 1rem; }
    pre {
      min-height: 220px;
      max-height: 420px;
      overflow: auto;
      margin: 0;
      padding: 16px;
      color: #e3edf2;
      background: #172b3a;
      border-radius: 7px;
      font: 13px/1.5 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .download { margin-top: 14px; }
    .hidden { display: none; }

    @media (max-width: 520px) {
      body { padding: 16px 10px; }
      main { padding: 20px 16px; }
      .actions { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Review a construction plan</h1>
    <p class="intro">Upload a PDF to check the plan and create a marked-up review copy.</p>

    <section class="drop-area" id="drop-area" aria-label="PDF upload area">
      <div>
        <p>Drop one PDF here, or choose a file from your computer.</p>
        <button type="button" id="choose-button">Choose PDF...</button>
        <input type="file" id="file-input" accept=".pdf,application/pdf" hidden>
      </div>
    </section>

    <p class="selected-file" id="selected-file">No PDF selected</p>
    <div class="actions">
      <button type="button" id="start-button" disabled>Start review</button>
      <span class="status" id="status" role="status">Ready</span>
    </div>

    <h2 class="output-heading">Review output</h2>
    <pre id="output" aria-live="polite"></pre>
    <a class="download hidden" id="download" href="">Download reviewed PDF</a>
  </main>

  <script>
    const dropArea = document.getElementById("drop-area");
    const fileInput = document.getElementById("file-input");
    const chooseButton = document.getElementById("choose-button");
    const startButton = document.getElementById("start-button");
    const selectedFile = document.getElementById("selected-file");
    const status = document.getElementById("status");
    const output = document.getElementById("output");
    const download = document.getElementById("download");
    let pdfFile = null;
    let eventSource = null;
    let activeJobId = null;

    function selectPdf(file) {
      if (!file || !file.name.toLowerCase().endsWith(".pdf")) {
        status.textContent = "Please select a PDF file.";
        return;
      }
      pdfFile = file;
      selectedFile.textContent = file.name;
      startButton.disabled = false;
      status.textContent = "Ready to review";
      download.classList.add("hidden");
    }

    chooseButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => selectPdf(fileInput.files[0]));

    for (const eventName of ["dragenter", "dragover"]) {
      dropArea.addEventListener(eventName, event => {
        event.preventDefault();
        dropArea.classList.add("dragging");
      });
    }
    for (const eventName of ["dragleave", "drop"]) {
      dropArea.addEventListener(eventName, event => {
        event.preventDefault();
        dropArea.classList.remove("dragging");
      });
    }
    dropArea.addEventListener("drop", event => {
      const files = event.dataTransfer.files;
      if (files.length !== 1) {
        status.textContent = "Please drop one PDF file at a time.";
        return;
      }
      selectPdf(files[0]);
    });

    startButton.addEventListener("click", async () => {
      if (!pdfFile) return;
      startButton.disabled = true;
      chooseButton.disabled = true;
      download.classList.add("hidden");
      output.textContent = `Uploading ${pdfFile.name}...\n`;
      status.textContent = "Starting review...";
      if (eventSource) eventSource.close();

      const form = new FormData();
      form.append("file", pdfFile);
      try {
        const response = await fetch("/api/reviews", { method: "POST", body: form });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Could not start review.");

        activeJobId = result.job_id;
        status.textContent = "Review running...";
        eventSource = new EventSource(`/api/reviews/${activeJobId}/events`);
        eventSource.addEventListener("output", event => {
          output.textContent += JSON.parse(event.data).text;
          output.scrollTop = output.scrollHeight;
        });
        eventSource.addEventListener("completed", event => {
          const result = JSON.parse(event.data);
          eventSource.close();
          status.textContent = "Review complete";
          download.href = `/api/reviews/${activeJobId}/download`;
          download.download = result.filename;
          download.classList.remove("hidden");
          startButton.disabled = false;
          chooseButton.disabled = false;
        });
        eventSource.addEventListener("failed", event => {
          const result = JSON.parse(event.data);
          eventSource.close();
          status.textContent = "Review failed";
          output.textContent += `\nReview failed: ${result.message}\n`;
          startButton.disabled = false;
          chooseButton.disabled = false;
        });
        eventSource.onerror = () => {
          if (eventSource.readyState === EventSource.CLOSED) {
            status.textContent = "Connection to the review server was lost.";
            startButton.disabled = false;
            chooseButton.disabled = false;
          }
        };
      } catch (error) {
        status.textContent = "Review could not be started.";
        output.textContent += `\n${error.message}\n`;
        startButton.disabled = false;
        chooseButton.disabled = false;
      }
    });
  </script>
</body>
</html>
